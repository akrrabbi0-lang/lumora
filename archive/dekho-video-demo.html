<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>দেখো ভিডিও</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#14231f;--mute:#5b6b66;--line:#d8e0dc;--free:#0f766e;--ad:#b7791f;--paid:#8a2b5c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a17;--card:#18262f;--ink:#e8f0ec;--mute:#9db0a9;--line:#2a3b36;--free:#38c2b3;--ad:#f0b84a;--paid:#e57bb0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a17;--card:#18262f;--ink:#e8f0ec;--mute:#9db0a9;--line:#2a3b36;--free:#38c2b3;--ad:#f0b84a;--paid:#e57bb0;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;line-height:1.6}
header,main{max-width:1060px;margin:0 auto;padding:0 16px}
header{padding-top:22px}
h1{font-size:1.9rem;margin:0;font-weight:700}
header p{margin:2px 0 0;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.bar button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar .sep{width:1px;background:var(--line);margin:0 4px}
button:focus-visible{outline:3px solid var(--ad);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:16px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
.thumb{aspect-ratio:16/9;position:relative;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:700;font-size:1.05rem}
.dur{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.65);font-size:.8rem;padding:1px 8px;border-radius:4px;font-weight:500}
.info{padding:10px 12px 12px}
.info h3{margin:0;font-size:1rem}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--mute);font-size:.88rem}
.tag{font-weight:700;font-size:.82rem;padding:1px 10px;border-radius:999px;border:1.5px solid currentColor}
.t-free{color:var(--free)}.t-ad{color:var(--ad)}.t-paid{color:var(--paid)}
dialog{border:none;border-radius:12px;padding:0;width:min(640px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.screen{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:16px}
.panel{padding:14px 18px 18px}
.panel h2{margin:0 0 4px;font-size:1.25rem}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font:inherit;font-weight:700;border:none;border-radius:8px;padding:9px 18px;cursor:pointer;color:#fff}
.btn.pay{background:var(--paid)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.prog{width:80%;height:6px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#fff}
.big{font-size:2.4rem;font-weight:700;line-height:1}
.note{color:var(--mute);font-size:.85rem;margin:8px 0 0}
</style>
</head>
<body>
<header>
  <h1>দেখো ভিডিও</h1>
  <p>ফ্রি, বিজ্ঞাপন দেখে, অথবা টাকা দিয়ে — যেভাবে খুশি দেখুন।</p>
  <div class="bar" id="bar"></div>
</header>
<main><div class="grid" id="grid"></div></main>

<dialog id="dlg" aria-label="ভিডিও">
  <div class="screen" id="screen"></div>
  <div class="panel">
    <h2 id="dt"></h2><div id="dm" class="note"></div>
    <div class="row" id="actions"></div>
    <p class="note">ডেমো সংস্করণ: বিজ্ঞাপন ও পেমেন্ট এখানে নকল করা হয়েছে।</p>
  </div>
</dialog>

<script>
const V=[
 {id:1,t:"গ্রামবাংলার এক দিন",d:"42:10",k:"long",a:"free",c:["#0f766e","#134e4a"]},
 {id:2,t:"রান্নার সহজ ১০ রেসিপি",d:"1:05:30",k:"long",a:"ad",c:["#b7791f","#78350f"]},
 {id:3,t:"পুরো ইংরেজি কোর্স (পর্ব ১–১০)",d:"2:20:00",k:"long",a:"paid",p:199,c:["#8a2b5c","#4a1d3a"]},
 {id:4,t:"আজকের মজার মুহূর্ত",d:"0:45",k:"clip",a:"free",c:["#2563eb","#1e3a8a"]},
 {id:5,t:"ম্যাচের সেরা গোল",d:"1:10",k:"clip",a:"ad",c:["#c2410c","#7c2d12"]},
 {id:6,t:"এক্সক্লুসিভ ব্যাকস্টেজ ক্লিপ",d:"3:30",k:"clip",a:"paid",p:29,c:["#7c3aed","#4c1d95"]},
 {id:7,t:"ঢাকার রাস্তার খাবার",d:"28:45",k:"long",a:"free",c:["#047857","#064e3b"]},
 {id:8,t:"ফটোগ্রাফি মাস্টারক্লাস",d:"1:35:00",k:"long",a:"paid",p:349,c:["#be185d","#831843"]},
 {id:9,t:"ট্রেলার: নতুন সিনেমা",d:"2:15",k:"clip",a:"ad",c:["#0e7490","#164e63"]}
];
const L={free:"ফ্রি",ad:"বিজ্ঞাপন দেখে",paid:"টাকা দিয়ে"};
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
let fA="all",fK="all",unlocked=new Set();
try{unlocked=new Set(JSON.parse(localStorage.getItem("unlocked")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("unlocked",JSON.stringify([...unlocked]))}catch(e){}};
const $=s=>document.querySelector(s);

function bar(){
 const A=[["all","সব"],["free","ফ্রি"],["ad","বিজ্ঞাপন দেখে"],["paid","টাকা দিয়ে"]],K=[["all","সব ধরন"],["long","লম্বা ভিডিও"],["clip","ক্লিপ"]];
 $("#bar").innerHTML=A.map(x=>`<button data-a="${x[0]}" aria-pressed="${fA==x[0]}">${x[1]}</button>`).join("")+'<span class="sep"></span>'+K.map(x=>`<button data-k="${x[0]}" aria-pressed="${fK==x[0]}">${x[1]}</button>`).join("");
}
$("#bar").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.a)fA=b.dataset.a;if(b.dataset.k)fK=b.dataset.k;bar();grid()};

function tagOf(v){
 if(v.a=="paid"&&unlocked.has(v.id))return'<span class="tag t-free">কেনা হয়েছে</span>';
 return`<span class="tag t-${v.a}">${v.a=="paid"?"৳ "+bn(v.p):L[v.a]}</span>`}
function grid(){
 $("#grid").innerHTML=V.filter(v=>(fA=="all"||v.a==fA)&&(fK=="all"||v.k==fK)).map(v=>
 `<button class="card" data-id="${v.id}"><div class="thumb" style="background:linear-gradient(135deg,${v.c[0]},${v.c[1]})"><span class="dur">${bn(v.d)}</span>${v.k=="clip"?"ক্লিপ":"পূর্ণ ভিডিও"}</div>
 <div class="info"><h3>${v.t}</h3><div class="meta"><span>${v.k=="clip"?"ছোট ক্লিপ":"লম্বা ভিডিও"}</span>${tagOf(v)}</div></div></button>`).join("")}
$("#grid").onclick=e=>{const c=e.target.closest(".card");if(c)open(+c.dataset.id)};

let timer;
function open(id){
 const v=V.find(x=>x.id==id),s=$("#screen");
 clearInterval(timer);
 s.style.background=`linear-gradient(135deg,${v.c[0]},${v.c[1]})`;
 $("#dt").textContent=v.t;$("#dm").textContent=(v.k=="clip"?"ক্লিপ":"লম্বা ভিডিও")+" · "+bn(v.d);
 const A=$("#actions");A.innerHTML="";
 const close=()=>{clearInterval(timer);$("#dlg").close()};
 const closeBtn=()=>{const b=document.createElement("button");b.className="btn ghost";b.textContent="বন্ধ করুন";b.onclick=close;A.append(b)};
 if(v.a=="free"||unlocked.has(v.id)||(v.a=="ad"&&unlocked.has(v.id)))play(v);
 else if(v.a=="ad"){
  s.innerHTML='<div>বিজ্ঞাপন চলছে</div><div class="big" id="n">5</div><div class="prog"><i id="p"></i></div>';
  let n=5;timer=setInterval(()=>{n--;$("#n").textContent=bn(n);$("#p").style.width=(5-n)*20+"%";
   if(n<=0){clearInterval(timer);play(v);}},1000);
  $("#n").textContent=bn(5);
 } else {
  s.innerHTML=`<div>এই ভিডিও দেখতে কিনতে হবে</div><div class="big">৳ ${bn(v.p)}</div>`;
  ["বিকাশ","নগদ","কার্ড"].forEach(m=>{const b=document.createElement("button");b.className="btn pay";b.textContent=m+" দিয়ে কিনুন";
   b.onclick=()=>{unlocked.add(v.id);save();grid();play(v)};A.append(b)});
 }
 closeBtn();
 if(!$("#dlg").open)$("#dlg").showModal();
}
function play(v){
 const s=$("#screen");
 if(v.a!="free"){unlocked.add(v.id);save();grid()}
 s.innerHTML='<div class="big">▶</div><div>এখন চলছে</div><div class="prog"><i id="p"></i></div>';
 let w=0;timer=setInterval(()=>{w=(w+1)%101;const p=$("#p");if(p)p.style.width=w+"%"},300);
 const A=$("#actions");if(!A.querySelector(".ghost")){const b=document.createElement("button");b.className="btn ghost";b.textContent="বন্ধ করুন";b.onclick=()=>{clearInterval(timer);$("#dlg").close()};A.append(b)}
}
$("#dlg").addEventListener("close",()=>clearInterval(timer));
bar();grid();
</script>
</body>
</html>
